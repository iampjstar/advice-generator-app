<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Advice generator app</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
<main class="advice-card">
  <p class="advice-label">ADVICE #<span id="advice-id">117</span></p>
  <h1 id="advice-text"> Your advice will appear here. </h1>
  <picture class="divider">
    <source media="(max-width: 600px)" srcset="./images/pattern-divider-mobile.svg">
    <img src="./images/pattern-divider-desktop.svg" alt="">
  </picture>
<button id="advice-button" aria-label="Get new advice">
  <img src="./images/icon-dice.svg" alt="">
</button>
</main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener noreferrer">Frontend Mentor</a>. 
    Coded by <a href="#" target="_blank" rel="noopener noreferrer">Pj Star</a>.
  </footer>
  <script src="script.js"></script>
</body>
</html>
